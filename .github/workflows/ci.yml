# Repository checks that are meaningful from day one and grow with the project.
# Application tests (pytest, vitest, OPA) are added in Phase 1.
#
# Actions are pinned to full commit SHAs (mutable tags can be repointed).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: shell syntax
        run: |
          fail=0
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::shell syntax error"; fail=1; }
          done
          sh -n .githooks/pre-commit || { echo "::error::hook syntax error"; fail=1; }
          exit $fail

      - name: pre-commit hook blocks secrets
        run: ./scripts/test-hooks.sh

      - name: validate config files
        run: |
          python3 - <<'PY'
          import sys, glob
          try:
              import tomllib
          except ModuleNotFoundError:
              tomllib = None
          ok = True
          if tomllib:
              for f in glob.glob('*.toml'):
                  try:
                      tomllib.load(open(f, 'rb'))
                      print(f"ok  {f}")
                  except Exception as e:
                      print(f"ERR {f}: {e}"); ok = False
          else:
              print("tomllib unavailable; skipping TOML validation")
          sys.exit(0 if ok else 1)
          PY

      - name: validate workflow YAML
        run: |
          python3 - <<'PY'
          import sys, glob
          try:
              import yaml
          except ModuleNotFoundError:
              print("pyyaml unavailable; skipping"); sys.exit(0)
          ok = True
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f)); print(f"ok  {f}")
              except Exception as e:
                  print(f"ERR {f}: {e}"); ok = False
          sys.exit(0 if ok else 1)
          PY

  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: install and test the SDK
        working-directory: sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk
          pip install -r requirements-dev.txt
      - name: run app tests
        run: pytest

  opa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: install opa
        run: |
          # Download to $RUNNER_TEMP, NOT the repo root (there is a policy/ dir,
          # and a bare `-o opa` would be a confusing path).
          curl -sSfL -o "$RUNNER_TEMP/opa" https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: opa test
        run: opa test policy/ -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"
      - name: build the web UI
        working-directory: app/web
        run: |
          npm ci || npm install
          npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.3
      - name: lint and render the chart
        run: |
          helm lint deploy/helm/agent-platform
          helm template agent-platform deploy/helm/agent-platform >/dev/null
          # The toggles must render too (ingress on, observability off).
          helm template agent-platform deploy/helm/agent-platform \
            --set ingress.enabled=true --set observability_stack.enabled=false >/dev/null
