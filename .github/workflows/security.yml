# Security workflow: secret scanning (always), plus SAST / dependency / image
# scans that activate automatically once the relevant files exist.
#
# The secret scan is the load-bearing one and runs on every push/PR. It is the
# backstop for the local pre-commit hook (which can be bypassed with --no-verify).
#
# Hardening notes:
#  - All actions are pinned to a full commit SHA (mutable tags can be silently
#    repointed by the action owner). The trailing comment records the version.
#  - No `curl | sh`: tools are installed via pinned actions, not piped to a shell.
#  - hashFiles() is only available in step-level expressions, not job-level `if`.
name: security

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Secrets — always runs.
  # ---------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: ensure no .env is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be committed — use .env.example instead"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::a tracked .env file was found"
            exit 1
          fi
          echo "ok: no .env tracked (.env.example is the committed template)"

      - name: gitleaks
        # Run the gitleaks CLI directly rather than the GitHub Action: it scans
        # the full history with no GitHub API/SARIF dependency, so it works
        # under least-privilege permissions and identically on push and PR.
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks git -c .gitleaks.toml --no-banner --redact --exit-code 1

  # ---------------------------------------------------------------------------
  # 2. SAST — runs once application code exists.
  # ---------------------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: semgrep
        if: ${{ hashFiles('**/*.py', '**/*.ts', '**/*.tsx', '**/*.js') != '' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --quiet

  # ---------------------------------------------------------------------------
  # 3. Dependency audit — runs once manifests exist.
  # ---------------------------------------------------------------------------
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        if: ${{ hashFiles('**/requirements*.txt') != '' }}
        with:
          python-version: "3.13"
      - name: pip-audit
        if: ${{ hashFiles('**/requirements*.txt') != '' }}
        run: |
          python -m pip install --upgrade pip pip-audit
          find . -name 'requirements*.txt' -not -path '*/node_modules/*' \
            -exec pip-audit -r {} \;

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        if: ${{ hashFiles('**/package.json') != '' }}
        with:
          node-version: "22"
      - name: npm audit
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          for pkg in $(find . -name package.json -not -path '*/node_modules/*' -not -path '*/dist/*'); do
            (cd "$(dirname "$pkg")" && npm audit --audit-level=high)
          done

  # ---------------------------------------------------------------------------
  # 4. SBOM + filesystem scan — runs once Dockerfiles exist.
  #
  # Image signing (cosign, keyless Sigstore) lands in Phase 2, once images are
  # pushed to a registry: it needs `id-token: write` for the workflow OIDC
  # identity and adds `cosign sign` / `cosign verify`. See ADR-0010.
  # ---------------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: generate SBOM (Syft)
        if: ${{ hashFiles('**/Dockerfile', '**/*.Dockerfile') != '' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: scan filesystem (Trivy)
        if: ${{ hashFiles('**/Dockerfile', '**/*.Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          scanners: vuln,secret,config
