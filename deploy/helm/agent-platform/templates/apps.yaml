{{- /*
The application services: one Deployment + Service per entry in .Values.services.
The agent and gateway additionally mount the SPIFFE Workload API socket and the
trust bundle.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- if and (eq $name "sandbox") $svc.stateSize }}
---
# The sandbox's own storage (S9). It stands in for a vendor's systems, so this is
# its volume, not the platform's — point SANDBOX_BASE_URL at a real backend and
# neither this nor the sandbox exists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-state
  labels:
    app: {{ $name }}
    {{- include "agent-platform.labels" $ | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $svc.stateSize }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "agent-platform.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      {{- if $.Values.mesh.inject }}
      annotations:
        linkerd.io/inject: enabled
        # The mesh proxy is a sidecar in the pod; the HPA needs it to declare
        # requests too, or CPU utilization cannot be computed.
        config.linkerd.io/proxy-cpu-request: 25m
        config.linkerd.io/proxy-memory-request: 64Mi
        {{- if $svc.spiffe }}
        # The SPIFFE listener must NOT be mesh-terminated, or the proxy proves its
        # own identity and hides the peer's SVID from the server (ADR-0012).
        config.linkerd.io/skip-inbound-ports: "8443"
        config.linkerd.io/skip-outbound-ports: "8443"
        {{- end }}
      {{- end }}
    spec:
      {{- if $svc.spiffe }}
      serviceAccountName: {{ $name }}
      {{- end }}
      affinity:
        # Spread replicas across nodes (soft, so a single-node cluster still
        # schedules them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $name }}
                topologyKey: kubernetes.io/hostname
      securityContext:
        {{- include "agent-platform.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "agent-platform.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "agent-platform.commonEnv" $ | nindent 12 }}
            {{- if $svc.spiffe }}
            - name: SPIFFE_SOCKET
              value: {{ $.Values.spire.socketPath | quote }}
            - name: SPIFFE_BUNDLE
              value: {{ $.Values.spire.bundlePath | quote }}
            {{- end }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and (eq $name "sandbox") $svc.stateSize }}
            - name: SANDBOX_STATE_PATH
              value: /data/sandbox-state.json
            {{- end }}
            {{- if and $.Values.database.url (has $name (list "api" "agent" "gateway")) }}
            - name: DATABASE_URL
              value: {{ $.Values.database.url | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.spiffePort }}
            - name: spiffe
              containerPort: {{ $svc.spiffePort }}
            {{- end }}
          {{- if $svc.healthPort }}
            - name: healthz
              containerPort: {{ $svc.healthPort }}
          {{- end }}
          securityContext:
            {{- include "agent-platform.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- if $svc.spiffe }}
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if and (eq $name "sandbox") $svc.stateSize }}
            - name: state
              mountPath: /data
            {{- end }}
          {{- /*
          A mTLS-only listener cannot be probed by the kubelet, which has no SVID to
          present: asking whether the socket is open is answered even by a hung
          process. Such a service sets `healthPort` and the app serves liveness there,
          and nothing else (S16).
          */}}
          {{- $probePort := $svc.healthPort | default $svc.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $probePort }}
            initialDelaySeconds: {{ if $svc.healthPort }}10{{ else }}5{{ end }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $probePort }}
            initialDelaySeconds: {{ if $svc.healthPort }}15{{ else }}10{{ end }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        {{- if $svc.spiffe }}
        - name: spiffe-workload-api
          hostPath:
            path: {{ $.Values.spire.agentSocketHostPath }}
            type: Directory
        - name: spire-bundle
          configMap:
            name: {{ $.Values.spire.bundleConfigMap }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if and (eq $name "sandbox") $svc.stateSize }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}-state
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "agent-platform.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
    {{- if $svc.spiffePort }}
    # The SPIFFE listener (S7): machine callers present an SVID here.
    - name: spiffe
      port: {{ $svc.spiffePort }}
      targetPort: {{ $svc.spiffePort }}
    {{- end }}
{{- end }}
{{- end }}
