{{- /*
ServiceAccounts for the workloads that hold a SPIFFE identity. SPIRE registers
entries by namespace + service account, so these names are part of the contract
between this chart and the SPIRE registration (see the chart README).
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.spiffe }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "agent-platform.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
