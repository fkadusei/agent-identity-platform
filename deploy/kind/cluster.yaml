# kind cluster for the agent-platform demo.
#
# One control-plane and two workers, so the replicated services actually spread
# (and a node can be drained to prove it). A single node would still run
# everything — anti-affinity is soft — but HA is only meaningful with >1 node.
#
# No host port mappings on purpose — demo.sh drives everything via `kubectl exec`.
# Port-forward commands for browser access are in docs/operator-guide.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-platform
nodes:
  - role: control-plane
  - role: worker
  - role: worker
