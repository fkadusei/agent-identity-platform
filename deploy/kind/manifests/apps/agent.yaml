# =============================================================================
# The agent service.
#
# Holds the LangGraph run state in memory, so a paused (approval-required) run
# can be resumed via POST /resume. It fetches a JWT-SVID from the Workload API
# and exchanges the rep's token per call — it holds no static credential.
#
# Model calls go ONLY through the LLM gateway, over mTLS with the agent's
# X.509-SVID. The agent has no provider key and no model endpoint of its own.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
      annotations:
        # The mesh proxy is a sidecar in the pod, so the HPA needs it to
        # declare requests too — otherwise CPU utilization cannot be computed.
        config.linkerd.io/proxy-cpu-request: 25m
        config.linkerd.io/proxy-memory-request: 64Mi
        # The SPIFFE listener must NOT be mesh-terminated: Linkerd would prove
        # *its* identity and hide the peer's SVID from our server, so the
        # per-hop identity check in app/common/workload.py could never see it.
        # These two tell the proxy to leave port 8443 alone in both directions —
        # it passes straight through to app/common/server.py — while every other
        # hop (Keycloak, OPA, Postgres, the sandbox, /metrics) keeps mesh mTLS.
        config.linkerd.io/skip-inbound-ports: "8443"
        config.linkerd.io/skip-outbound-ports: "8443"
    spec:
      serviceAccountName: agent
      affinity:
        # Spread replicas across nodes when there is more than one (soft, so a
        # single-node cluster still schedules them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: agent
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: agent-platform/agent:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: KC_ISSUER
              value: http://keycloak:8080/realms/agent-platform
            - name: SPIFFE_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            - name: SPIFFE_BUNDLE
              value: /run/spire/bundle/bundle.crt
            - name: AGENT_SPIFFE_ID
              value: spiffe://acme.com/ns/agent-platform/sa/agent
            # Machine hops: SPIFFE on both sides, and the callee is named in a
            # JWT-SVID header (S7). The user's token still rides in Authorization.
            - name: TOOL_SERVER_URL
              value: https://tools:8443
            - name: APPROVALS_URL
              value: https://api:8443
            - name: AUDIT_URL
              value: https://api:8443
            # The agent reaches the model ONLY through the gateway, over mTLS.
            - name: LLM_GATEWAY_URL
              value: https://gateway:8443
            # The audience it requests its JWT-SVID for, so the gateway can
            # verify the token and key per-agent limits on the identity.
            - name: LLM_GATEWAY_AUDIENCE
              value: spiffe://acme.com/ns/agent-platform/sa/gateway
            # Durable run checkpoints, so a paused run survives a restart.
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: agent
            - name: PGDATABASE
              value: agent_platform
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            # Used only by the demo/attack scripts (they stand in for alice's
            # and the manager's apps when minting tokens). From a Secret, never
            # committed.
            - name: DEMO_CLI_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DEMO_CLI_SECRET
            - name: MANAGER_CLI_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MANAGER_CLI_SECRET
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent-platform
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    # The SPIFFE listener (S7): machine callers present an SVID here.
    - name: spiffe
      port: 8443
      targetPort: 8443
