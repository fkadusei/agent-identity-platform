# =============================================================================
# Platform API — human approvals (and, later, tasks).
#
# It authenticates callers with their exchanged token (aud=mcp-tools) and binds
# each approval to the token's user and workload. No secrets, no SPIFFE socket
# needed: it only verifies tokens.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: agent-platform/api:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: KC_ISSUER
              value: http://keycloak:8080/realms/agent-platform
            - name: TOKEN_AUDIENCE
              value: mcp-tools
            # NOTE: no TRUSTED_WORKLOAD here. The API accepts tokens from both
            # the agent (creating approvals) and human approvers (deciding them),
            # so it enforces the audience but not a single issuing workload.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agent-platform
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
