# =============================================================================
# Platform API — human approvals (and, later, tasks).
#
# It authenticates callers with their exchanged token (aud=mcp-tools) and binds
# each approval to the token's user and workload. No secrets, no SPIFFE socket
# needed: it only verifies tokens.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: agent-platform/api:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: KC_ISSUER
              value: http://keycloak:8080/realms/agent-platform
            - name: TOKEN_AUDIENCE
              value: mcp-tools
            # NOTE: no TRUSTED_WORKLOAD here. The API accepts tokens from both
            # the agent (creating approvals) and human approvers (deciding them),
            # so it enforces the audience but not a single issuing workload.
            - name: AGENT_URL
              value: http://agent:8081
            # Client secrets, mounted from a Secret that setup.sh creates from
            # the gitignored .env (never committed):
            #   DEMO_/MANAGER_CLI_SECRET — the scripted demo's personas
            #   PORTAL_SECRET            — real user login (the web app's client)
            #   ADMIN_CLIENT_SECRET      — least-privilege Keycloak Admin API
            - name: DEMO_CLI_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DEMO_CLI_SECRET
            - name: MANAGER_CLI_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MANAGER_CLI_SECRET
            - name: PORTAL_CLIENT_ID
              value: portal
            - name: PORTAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PORTAL_SECRET
            - name: ADMIN_CLIENT_ID
              value: platform-admin
            - name: ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ADMIN_CLIENT_SECRET
            - name: KEYCLOAK_ADMIN_URL
              value: http://keycloak:8080/admin/realms/agent-platform
            # Self-service signup toggle. Set to "0" to make enrollment
            # admin-only (see docs/enrollment-and-roles.md).
            - name: SIGNUP_ENABLED
              value: "1"
            # The tenant a self-enrolled account is placed in. A signup form
            # cannot choose its own tenant (see docs/enrollment-and-roles.md).
            - name: DEFAULT_TENANT
              value: acme
            # Durable approvals. Without a database configured the store is
            # in-memory; the password is a Secret reference, so no credential
            # appears in a URL.
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: agent
            - name: PGDATABASE
              value: agent_platform
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agent-platform
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
