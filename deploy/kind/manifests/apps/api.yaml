# =============================================================================
# Platform API — approvals, tasks, audit, roles, admin.
#
# It authenticates callers with their exchanged token (aud=mcp-tools) and binds
# each approval to the token's user and workload.
#
# It also holds a SPIFFE identity (S7): a registered service account, so the
# Workload API issues it an SVID. The api serves two trust domains — the browser
# (a user with a token) and the agent (a workload that can prove itself) — and
# they are on separate listeners; see docs/tls.md.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: agent-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        # The mesh proxy is a sidecar in the pod, so the HPA needs it to
        # declare requests too — otherwise CPU utilization cannot be computed.
        config.linkerd.io/proxy-cpu-request: 25m
        config.linkerd.io/proxy-memory-request: 64Mi
        # The SPIFFE listener must NOT be mesh-terminated: Linkerd would prove
        # *its* identity and hide the peer's SVID from our server, so the
        # per-hop identity check in app/common/workload.py could never see it.
        # These two tell the proxy to leave port 8443 alone in both directions —
        # it passes straight through to app/common/server.py — while every other
        # hop (Keycloak, OPA, Postgres, the sandbox, /metrics) keeps mesh mTLS.
        config.linkerd.io/skip-inbound-ports: "8443"
        config.linkerd.io/skip-outbound-ports: "8443"
    spec:
      serviceAccountName: api
      affinity:
        # Spread replicas across nodes when there is more than one (soft, so a
        # single-node cluster still schedules them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: agent-platform/api:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: KC_ISSUER
              value: http://keycloak:8080/realms/agent-platform
            - name: SPIFFE_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            - name: SPIFFE_BUNDLE
              value: /run/spire/bundle/bundle.crt
            # Its identity, so a JWT-SVID it asks for is bound to it.
            - name: API_SPIFFE_ID
              value: spiffe://acme.com/ns/agent-platform/sa/api
            - name: TOKEN_AUDIENCE
              value: mcp-tools
            # NOTE: no TRUSTED_WORKLOAD here. The API accepts tokens from both
            # the agent (creating approvals) and human approvers (deciding them),
            # so it enforces the audience but not a single issuing workload.
            # The task proxy is a machine hop: SPIFFE, with the api naming itself.
            - name: AGENT_URL
              value: https://agent:8443
            # This service's own SPIFFE ID: the audience its machine callers must
            # be bound to (S7). Unset would mean "do not require a caller name".
            - name: WORKLOAD_AUDIENCE
              value: spiffe://acme.com/ns/agent-platform/sa/api
            # Client secrets, mounted from a Secret that setup.sh creates from
            # the gitignored .env (never committed):
            #   DEMO_/MANAGER_CLI_SECRET — the scripted demo's personas
            #   PORTAL_SECRET            — real user login (the web app's client)
            #   ADMIN_CLIENT_SECRET      — least-privilege Keycloak Admin API
            - name: DEMO_CLI_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DEMO_CLI_SECRET
            - name: MANAGER_CLI_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MANAGER_CLI_SECRET
            - name: PORTAL_CLIENT_ID
              value: portal
            - name: PORTAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PORTAL_SECRET
            - name: ADMIN_CLIENT_ID
              value: platform-admin
            - name: ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ADMIN_CLIENT_SECRET
            - name: KEYCLOAK_ADMIN_URL
              value: http://keycloak:8080/admin/realms/agent-platform
            # Self-service signup toggle. Set to "0" to make enrollment
            # admin-only (see docs/enrollment-and-roles.md).
            - name: SIGNUP_ENABLED
              value: "1"
            # The tenant a self-enrolled account is placed in. A signup form
            # cannot choose its own tenant (see docs/enrollment-and-roles.md).
            - name: DEFAULT_TENANT
              value: acme
            # Durable approvals. Without a database configured the store is
            # in-memory; the password is a Secret reference, so no credential
            # appears in a URL.
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: agent
            - name: PGDATABASE
              value: agent_platform
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
            - name: spire-bundle
              mountPath: /run/spire/bundle
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # The Workload API socket (on the node) and the trust bundle, which is
        # how any workload here obtains and verifies an SVID.
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agent-platform
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # The SPIFFE listener (S7): machine callers present an SVID here.
    - name: spiffe
      port: 8443
      targetPort: 8443
