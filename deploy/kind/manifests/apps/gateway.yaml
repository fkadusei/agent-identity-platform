# =============================================================================
# LLM gateway — the only component that talks to a model provider.
#
# It serves HTTPS using its own X.509-SVID as the server certificate and
# REQUIRES a client SVID verified against the SPIRE trust bundle (mTLS). The
# agent therefore needs no model credential at all.
#
# Readiness uses a TCP probe on purpose: an HTTP probe from the kubelet has no
# client certificate and would fail the mTLS handshake.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: agent-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        # The mesh proxy is a sidecar in the pod, so the HPA needs it to
        # declare requests too — otherwise CPU utilization cannot be computed.
        config.linkerd.io/proxy-cpu-request: 25m
        config.linkerd.io/proxy-memory-request: 64Mi
        # The SPIFFE listener must NOT be mesh-terminated: Linkerd would prove
        # *its* identity and hide the peer's SVID from our server, so the
        # per-hop identity check in app/common/workload.py could never see it.
        # These two tell the proxy to leave port 8443 alone in both directions —
        # it passes straight through to app/common/server.py — while every other
        # hop (Keycloak, OPA, Postgres, the sandbox, /metrics) keeps mesh mTLS.
        config.linkerd.io/skip-inbound-ports: "8443"
        config.linkerd.io/skip-outbound-ports: "8443"
    spec:
      serviceAccountName: gateway
      affinity:
        # Spread replicas across nodes when there is more than one (soft, so a
        # single-node cluster still schedules them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: agent-platform/gateway:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: SPIFFE_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            - name: SPIFFE_BUNDLE
              value: /run/spire/bundle/bundle.crt
            - name: PORT
              value: "8443"
            - name: LLM_PROVIDER
              value: ollama
            - name: OLLAMA_URL
              value: http://host.docker.internal:11434
            - name: OLLAMA_MODEL
              value: llama3.2:3b
            # Callers present a JWT-SVID; the gateway verifies it against SPIRE's
            # JWKS and keys the limits below on the resulting SPIFFE ID.
            - name: SPIRE_JWKS_URL
              value: http://spire-oidc-discovery.agent-platform.svc.cluster.local:11080/keys
            - name: LLM_GATEWAY_AUDIENCE
              value: spiffe://acme.com/ns/agent-platform/sa/gateway
            # Per-agent limits (0 = unlimited).
            - name: LLM_RATE_LIMIT_PER_MINUTE
              value: "60"
            - name: LLM_TOKEN_BUDGET_PER_DAY
              value: "200000"
            # Durable limits: with a database configured the counters live in
            # Postgres, so they survive a restart and are shared across replicas.
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: agent
            - name: PGDATABASE
              value: agent_platform
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            # The ONLY place a provider key may live. Absent by default (Ollama
            # needs none); supplied via setup.sh from a gitignored .env.
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: LLM_API_KEY
                  optional: true
          ports:
            - containerPort: 8443
            # Liveness only, and only /healthz — see the probes below and S16.
            - name: healthz
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # The serving listener is mTLS, so the kubelet cannot check it: it has no
          # SVID to present. Probing the socket instead only proves *something*
          # accepted the connection — a hung process still does, because the kernel
          # completes the handshake — and a restart policy only restarts a process
          # that *exits*. So the gateway serves liveness (and nothing else) in the
          # clear, on its own port, started after the SVID is loaded (S16).
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agent-platform
spec:
  selector:
    app: gateway
  ports:
    - name: https
      port: 8443
      targetPort: 8443
