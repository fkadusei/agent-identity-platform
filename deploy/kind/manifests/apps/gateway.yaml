# =============================================================================
# LLM gateway — the only component that talks to a model provider.
#
# It serves HTTPS using its own X.509-SVID as the server certificate and
# REQUIRES a client SVID verified against the SPIRE trust bundle (mTLS). The
# agent therefore needs no model credential at all.
#
# Readiness uses a TCP probe on purpose: an HTTP probe from the kubelet has no
# client certificate and would fail the mTLS handshake.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: agent-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: agent-platform/gateway:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: SPIFFE_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            - name: SPIFFE_BUNDLE
              value: /run/spire/bundle/bundle.crt
            - name: PORT
              value: "8443"
            - name: LLM_PROVIDER
              value: ollama
            - name: OLLAMA_URL
              value: http://host.docker.internal:11434
            - name: OLLAMA_MODEL
              value: llama3.2:3b
            # The ONLY place a provider key may live. Absent by default (Ollama
            # needs none); supplied via setup.sh from a gitignored .env.
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: LLM_API_KEY
                  optional: true
          ports:
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agent-platform
spec:
  selector:
    app: gateway
  ports:
    - name: https
      port: 8443
      targetPort: 8443
