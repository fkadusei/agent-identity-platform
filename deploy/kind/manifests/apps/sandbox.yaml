# =============================================================================
# Sandbox — the synthetic CRM/orders/payments/ticketing API the tools call when
# TOOLS_BACKEND=http. It stands in for a real vendor sandbox, so the HTTP
# integration path is exercised end to end without credentials.
#
# Point SANDBOX_BASE_URL at a real sandbox to replace it; the tools only know
# the REST contract (docs/integrations.md).
#
# It keeps its own data (S9): refunds and drafts are snapshotted to a volume, so
# restarting this pod no longer resets them mid-demo. The volume is its storage —
# a stand-in for the vendor's own database, not the platform's.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-state
  namespace: agent-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: agent-platform/sandbox:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Where the simulated systems keep their state between restarts. Unset
            # means in-memory (tests, a local run).
            - name: SANDBOX_STATE_PATH
              value: /data/sandbox-state.json
          ports:
            - containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: sandbox-state
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: agent-platform
spec:
  selector:
    app: sandbox
  ports:
    - name: http
      port: 8090
      targetPort: 8090
