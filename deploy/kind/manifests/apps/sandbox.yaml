# =============================================================================
# Sandbox — the synthetic CRM/orders/payments/ticketing API the tools call when
# TOOLS_BACKEND=http. It stands in for a real vendor sandbox, so the HTTP
# integration path is exercised end to end without credentials.
#
# Point SANDBOX_BASE_URL at a real sandbox to replace it; the tools only know
# the REST contract (docs/integrations.md).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: agent-platform/sandbox:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: agent-platform
spec:
  selector:
    app: sandbox
  ports:
    - name: http
      port: 8090
      targetPort: 8090
