# =============================================================================
# Tool servers — the policy enforcement point (HTTP + MCP transports).
#
# Verifies the caller's token (aud=mcp-tools, azp=the agent), asks OPA, and
# requires a verified approval for high-risk actions before executing.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tools
  template:
    metadata:
      labels:
        app: tools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tools
          image: agent-platform/tools:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: KC_ISSUER
              value: http://keycloak:8080/realms/agent-platform
            - name: TOKEN_AUDIENCE
              value: mcp-tools
            - name: TRUSTED_WORKLOAD
              value: spiffe://acme.com/ns/agent-platform/sa/agent
            - name: OPA_URL
              value: http://opa:8181
            - name: APPROVALS_URL
              value: http://api:8080
            - name: AUDIT_URL
              value: http://api:8080
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tools
  namespace: agent-platform
spec:
  selector:
    app: tools
  ports:
    - name: http
      port: 8000
      targetPort: 8000
