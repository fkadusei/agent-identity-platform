# =============================================================================
# HorizontalPodAutoscalers for the stateless services.
#
# Scale on CPU: the services are I/O-bound in the demo, so the target is modest
# and the floor is 2 (matching the HA replicas) — the point is that the app tier
# grows under load without a redeploy.
#
# The API and tools also export the metrics a *custom*-metric HPA would use
# (approval backlog, request rate) — see docs/autoscaling.md for that next step.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: agent-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
