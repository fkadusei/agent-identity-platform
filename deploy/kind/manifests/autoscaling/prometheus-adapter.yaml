# =============================================================================
# prometheus-adapter — exposes Prometheus metrics as Kubernetes custom and
# external metrics, so a HorizontalPodAutoscaler can scale on the signal that
# matters instead of CPU. See docs/autoscaling.md.
#
# One component, two aggregated APIs:
#   custom.metrics.k8s.io    per-pod metrics (the HPA's `Pods` type) — request rate
#   external.metrics.k8s.io  platform-wide metrics (the HPA's `External` type) —
#                            the approval backlog, which is not per-pod
#
# The serving certificate is ours, generated by setup.sh and pinned into each
# APIService: `insecureSkipTLSVerify: false`, the same stance as metrics-server.
# That is also why the pod skips the mesh on 6443 — the API server is not a mesh
# client, and a proxy that terminated the connection would hide the peer (S7).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-adapter
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-adapter
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-adapter
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: agent-platform
---
# An aggregated API server delegates authorization to the API server, so it needs
# to create SubjectAccessReviews and read the extension-apiserver configuration.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-adapter:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-adapter-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: agent-platform
---
# The HPA controller reads these APIs through its own service account, and the
# built-in controller role covers only metrics.k8s.io — without this it gets a
# 403 from the aggregator and the HPA reports the metric as unavailable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custom-metrics-reader
rules:
  - apiGroups: ["custom.metrics.k8s.io", "external.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hpa-controller-custom-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: custom-metrics-reader
subjects:
  - kind: ServiceAccount
    name: horizontal-pod-autoscaler
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: agent-platform
data:
  config.yaml: |
    # Prometheus → Kubernetes metric translation. Both rules read the api's own
    # /metrics; nothing new is instrumented to autoscale.
    rules:
      # Requests per second, per pod (`Pods`). The adapter does the rate maths
      # because an HPA can only consume what is exposed here. The counter is
      # per-process, which is why Prometheus scrapes the api per pod.
      - seriesQuery: 'agent_platform_http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: namespace}
            pod: {resource: pod}
        name:
          matches: "^agent_platform_http_requests_total$"
          as: "http_requests_per_second"
        metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
    externalRules:
      # The approval backlog is a property of the platform, not of one pod: every
      # api replica exports the same gauge, so `max` is the queue depth (`sum`
      # would multiply it by the replica count).
      - seriesQuery: 'agent_platform_approvals_pending{namespace!=""}'
        resources:
          overrides:
            namespace: {resource: namespace}
        name:
          matches: "^agent_platform_approvals_pending$"
          as: "approvals_pending"
        metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>})'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  namespace: agent-platform
  labels:
    app: prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-adapter
  template:
    metadata:
      labels:
        app: prometheus-adapter
      annotations:
        # The API server's connection to this aggregated API is not meshed: let it
        # through untouched rather than having the proxy terminate it.
        config.linkerd.io/skip-inbound-ports: "6443"
    spec:
      serviceAccountName: prometheus-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus-adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0@sha256:932eae60e2bcf9c4660d6442da066ef1a79b4ea7cc232c61c7303069216ca006
          args:
            - --config=/etc/adapter/config.yaml
            - --prometheus-url=http://prometheus:9090
            - --secure-port=6443
            - --tls-cert-file=/var/run/serving-cert/tls.crt
            - --tls-private-key-file=/var/run/serving-cert/tls.key
            - --metrics-relist-interval=30s
            - --v=2
          ports:
            - name: https
              containerPort: 6443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 180Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
              readOnly: true
            - name: serving-cert
              mountPath: /var/run/serving-cert
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-adapter-config
        - name: serving-cert
          secret:
            secretName: prometheus-adapter-certs
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
  namespace: agent-platform
spec:
  selector:
    app: prometheus-adapter
  ports:
    - name: https
      port: 443
      targetPort: 6443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.custom.metrics.k8s.io
spec:
  group: custom.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 200
  insecureSkipTLSVerify: false
  service:
    name: prometheus-adapter
    namespace: agent-platform
    port: 443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  group: external.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 200
  insecureSkipTLSVerify: false
  service:
    name: prometheus-adapter
    namespace: agent-platform
    port: 443
