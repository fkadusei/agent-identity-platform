# =============================================================================
# Keycloak — OAuth 2.0 / OIDC Authorization Server.
#
# Roles:
#   1. Issues user tokens (alice and manager log in via direct grant).
#   2. Authenticates the AGENT as a client using its JWT-SVID
#      (client_id IS the SPIFFE ID; signature verified against the JWKS served
#      by SPIRE's OIDC discovery provider — no shared secret for the agent).
#   3. Performs RFC 8693 Standard Token Exchange: user token in -> audience-
#      scoped, 5-minute token out, carrying the delegation binding (sub + azp).
#
# Production mode (S2/S4): `start`, not `start-dev`, against the Postgres in
# `keycloak-env.yaml`. The realm is imported by the Job in `keycloak-import.yaml`
# — the server does not mount it — and the environment (hostname, database,
# cache) lives in the shared ConfigMap so the two cannot drift.
#
# Replicas: 2, behind the Service. Their sessions are shared through the `ispn`
# cache, discovering each other via the database (jdbc-ping), so either pod can
# answer; PodDisruptionBudget keeps one serving through a drain.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: agent-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      affinity:
        # Spread replicas across nodes when there is more than one (soft, so a
        # single-node cluster still schedules them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: keycloak
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          # Built by docker/keycloak.Dockerfile, which bakes `kc.sh build` into
          # the image so the running server never augments (see the header there).
          image: agent-platform/keycloak:demo
          imagePullPolicy: IfNotPresent
          # `start` = production mode; `--optimized` says the build is already
          # done, so nothing is written to /opt/keycloak. Everything else comes
          # from the environment, shared with the import Job so the two cannot
          # drift.
          args: ["start", "--optimized"]
          envFrom:
            - configMapRef:
                name: keycloak-env
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            # DEMO-ONLY admin credentials — used once, to create the master realm
            # on a fresh database. Never a real password; this cluster is
            # disposable. See docs/threat-model.md.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The first start augments the Quarkus app in-process, which is slow,
          # so liveness only begins once the startup probe has succeeded.
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            # A read-only root filesystem, which `start-dev` made impossible (its
            # runtime bytecode augmentation wrote into lib/quarkus — the exception
            # that used to live in .trivyignore.yaml). The image bakes the build,
            # so only the data dir and /tmp need to be writable.
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: agent-platform
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
