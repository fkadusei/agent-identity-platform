# =============================================================================
# Keycloak — OAuth 2.0 / OIDC Authorization Server.
#
# Roles in this demo:
#   1. Issues user tokens (alice logs in via direct grant through demo-cli).
#   2. Authenticates the AGENT as a client using its JWT-SVID
#      (client_id IS the SPIFFE ID; signature verified against the JWKS served
#      by SPIRE's OIDC discovery provider — no shared secret for the agent).
#   3. Performs RFC 8693 token exchange: user token in → audience-scoped,
#      5-minute token out, carrying the delegation chain (sub + act claims).
#
# start-dev + --features=token-exchange are DEMO settings.
# Docs: docs/architecture.md#keycloak — docs/runbook.md#keycloak
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.4
          args:
            - start-dev
            - --import-realm                 # imports /opt/keycloak/data/import/*
          # Standard Token Exchange (RFC 8693, V2) is enabled by default in
          # Keycloak 26.2+ and needs NO fine-grained admin permissions — just
          # the per-client switch set in realm.json. (Legacy V1 exchange, which
          # DID require fine-grained permissions, is deliberately not enabled.)
          env:
            # DEMO-ONLY admin credentials. Never a real password — this cluster
            # is disposable. See docs/threat-model.md.
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 8080
            - containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              # start-dev serves health on 8080 (no curl in the image); the
              # realm endpoint is a reliable liveness signal.
              path: /realms/agent-platform
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm        # created by scripts/setup.sh from realm.json
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: agent-platform
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
