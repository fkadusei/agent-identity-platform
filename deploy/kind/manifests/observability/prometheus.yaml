# Prometheus — scrapes the platform's metrics and serves the Grafana datasource.
#
# It scrapes three targets:
#   api             the platform counters (/metrics): logins, policy decisions
#                   (from the audit stream), approval backlog, request rates
#   otel-collector  span export health
#   opa             Go runtime metrics
#
# The api is scraped **per pod**, not through its Service. Its counters are
# per-process, so a Service that round-robins scrapes between replicas makes them
# jump backwards — and `rate()` over a counter that resets is noise. Per-pod
# scraping also yields the `pod` label a Pods-metric HPA needs (S6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: agent-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: agent-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: agent-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agent-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agent-platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: "${1}:8080"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8888"]
      - job_name: opa
        static_configs:
          - targets: ["opa:8181"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agent-platform
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          # /-/healthy is the process; /-/ready (above) is "ready to serve
          # queries". Liveness asks the first question on purpose.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: agent-platform
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
