# =============================================================================
# OPA — policy engine. Serves the decision at /v1/data/agentnhi/authz.
#
# The policy is loaded as a **bundle** (authz.rego + data.json + .manifest),
# built by scripts/build-bundle.sh from policy/authz.rego (the single source of
# truth CI tests) and mounted from the opa-bundle ConfigMap. The bundle's
# revision is stamped into every decision, and OPA emits structured decision
# logs to stdout so each decision is recorded with the revision that made it.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
      annotations:
        # The mesh proxy is a sidecar in the pod, so the HPA needs it to
        # declare requests too — otherwise CPU utilization cannot be computed.
        config.linkerd.io/proxy-cpu-request: 25m
        config.linkerd.io/proxy-memory-request: 64Mi
    spec:
      affinity:
        # Spread replicas across nodes when there is more than one (soft, so a
        # single-node cluster still schedules them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: opa
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: openpolicyagent/opa:0.68.0
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --bundle
            - /bundles
            - --log-level=info
            - --set=decision_logs.console=true
          ports:
            - containerPort: 8181
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Mount the bundle files individually. A whole-ConfigMap mount adds
            # Kubernetes' "..data" timestamp directory, which OPA's bundle loader
            # would try to read as bundle data.
            - name: bundle
              mountPath: /bundles/authz.rego
              subPath: authz.rego
              readOnly: true
            - name: bundle
              mountPath: /bundles/data.json
              subPath: data.json
              readOnly: true
            - name: bundle
              mountPath: /bundles/.manifest
              subPath: .manifest
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: bundle
          configMap:
            name: opa-bundle
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: agent-platform
spec:
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
