# =============================================================================
# SPIRE Server — the identity root of trust for the demo.
#
# What this deploys:
#   - SPIRE Server (StatefulSet): signs SVIDs, holds the registration registry,
#     attests nodes via Kubernetes projected service account tokens (k8s_psat).
#   - OIDC Discovery Provider (sidecar): publishes the JWT-SVID signing keys as
#     a JWKS over plain HTTP inside the cluster. This is how Keycloak learns to
#     trust SVIDs WITHOUT any key being copied anywhere.
#   - k8s_configmap bundle publisher: keeps the trust bundle current in the
#     "spire-bundle" ConfigMap so SPIRE agents can bootstrap. It replaced the
#     k8sbundle Notifier — see the note on the plugin block below.
#
# State (S1): the registration registry lives in Postgres, and the disk
# KeyManager's keys live on a PersistentVolumeClaim, so killing this pod no longer
# forgets the agents and entries or regenerates the CA. Running 2+ replicas would
# additionally need a *shared* KeyManager (a cloud KMS) — see the note in
# server.conf.tmpl. The server configuration itself is rendered by setup.sh from
# server.conf.tmpl into a Secret, because it carries the database password.
#
# Trust domain: acme.com (demo value).
# Docs: docs/tls.md (the identity edges) — docs/operator-guide.md (§5B, SPIRE
# recovery; §7 for `Failed to publish bundle`).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: agent-platform
---
# Lets SPIRE Server validate projected SA tokens of node agents (k8s_psat).
# It also needs to READ the agent pod/node to confirm the token's origin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-tokenreview
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: agent-platform
---
# Lets the bundle publisher apply the trust bundle ConfigMap in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle
  namespace: agent-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle
  namespace: agent-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-server-bundle
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: agent-platform
---
# Placeholder the bundle publisher fills with the trust bundle.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: agent-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spire-server-data
  namespace: agent-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# NOTE: the server configuration is deliberately not in this file. It carries
# the datastore password, so scripts/setup.sh renders server.conf.tmpl (same
# directory) with scripts/render.py and applies it as the `spire-server-config`
# Secret, which the StatefulSet mounts below. See docs/secrets.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-oidc-discovery-provider
  namespace: agent-platform
data:
  oidc-discovery-provider.conf: |
    log_level = "info"
    domains   = ["spire-oidc-discovery.agent-platform.svc.cluster.local"]

    server_api {
      address = "unix:///run/spire/server/private/api.sock"
    }

    # DEMO ONLY: serve the JWKS over plain HTTP inside the cluster so Keycloak
    # (running with ssl-required=none) can fetch it. Production: put this behind
    # TLS and require HTTPS on the Keycloak client.
    allow_insecure_scheme = true
    insecure_addr         = ":11080"
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: agent-platform
spec:
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
# Keycloak fetches the JWT-SVID public keys from this service.
apiVersion: v1
kind: Service
metadata:
  name: spire-oidc-discovery
  namespace: agent-platform
spec:
  selector:
    app: spire-server
  ports:
    - name: http
      port: 11080
      targetPort: 11080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: agent-platform
spec:
  serviceName: spire-server
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      shareProcessNamespace: true
      containers:
        - name: spire-server
          # Custom image = stock SPIRE server + the `jti` CredentialComposer
          # plugin. Built and loaded into kind by scripts/setup.sh.
          image: agent-platform/spire-server-jti:demo
          imagePullPolicy: IfNotPresent
          args: ["-config", "/run/spire/config/server.conf"]
          # Both references are optional and exist only in KMS mode (setup.sh
          # creates them when SPIRE_KEY_MANAGER=aws_kms). `optional: true` is what
          # keeps this one manifest valid in both modes: absent, they are a no-op,
          # so the disk path needs no conditional and no second copy of the file.
          envFrom:
            - configMapRef:
                name: spire-kms-config
                optional: true
            - secretRef:
                name: spire-kms-credentials
                optional: true
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-server-socket
              mountPath: /run/spire/server/private
            - name: spire-kms-policy
              mountPath: /run/spire/keys
              readOnly: true
            # Role-based access reads a profile file (role_arn + source_profile), so
            # the same Secret is also mounted. In static-credential mode these files
            # are simply never referenced.
            - name: spire-kms-creds
              mountPath: /run/spire/aws
              readOnly: true
          readinessProbe:
            exec:
              # Without this the container is Ready the moment it is Running, so a
              # crash-looping server (a bad KeyManager config, say) still looks
              # "rolled out" and the failure surfaces much later as
              # "no attested SPIRE agent found" — which names the wrong component.
              command:
                - /opt/spire/bin/spire-server
                - healthcheck
                - -socketPath
                - /run/spire/server/private/api.sock
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              # Must point at our configured socket, not the CLI default.
              command:
                - /opt/spire/bin/spire-server
                - healthcheck
                - -socketPath
                - /run/spire/server/private/api.sock
            initialDelaySeconds: 15
            periodSeconds: 30
        - name: oidc-discovery-provider
          image: ghcr.io/spiffe/oidc-discovery-provider:1.12.4
          args: ["-config", "/run/spire/oidc/config/oidc-discovery-provider.conf"]
          ports:
            - containerPort: 11080
          # `/keys` is the work this sidecar exists to do: the gateway verifies
          # JWT-SVIDs against it, and Keycloak fetches JWKS from it. A provider
          # that hangs stops naming machine callers rather than failing loudly, so
          # it is restarted on the same terms as everything else (S16).
          livenessProbe:
            httpGet:
              path: /keys
              port: 11080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 8
          volumeMounts:
            - name: spire-server-socket
              mountPath: /run/spire/server/private
              readOnly: true
            - name: oidc-config
              mountPath: /run/spire/oidc/config
              readOnly: true
      volumes:
        # Rendered by scripts/setup.sh from server.conf.tmpl — a Secret because
        # the datastore connection string carries the database password.
        - name: spire-config
          secret:
            secretName: spire-server-config
        # KMS mode only: the policy the KeyManager attaches to the keys it creates
        # (AWS needs an explicit one when the server does not assume a role).
        - name: spire-kms-policy
          secret:
            secretName: spire-kms-key-policy
            optional: true
        # KMS mode only, and then either env-style literals (static credentials) or
        # the profile files for a role (AWS_CONFIG_FILE / AWS_SHARED_CREDENTIALS_FILE
        # come from the spire-kms-config ConfigMap).
        - name: spire-kms-creds
          secret:
            secretName: spire-kms-credentials
            optional: true
        - name: oidc-config
          configMap:
            name: spire-oidc-discovery-provider
        # The registry is in Postgres (S1); this volume holds the disk KeyManager's
        # keys, so a restarted server signs with the *same* CA instead of
        # regenerating one (which used to expire every workload's SVID).
        - name: spire-data
          persistentVolumeClaim:
            claimName: spire-server-data
        - name: spire-server-socket
          emptyDir: {}
